apiVersion: v1
kind: Service
metadata:
  name: plex-egress
  namespace: default
  annotations:
    tailscale.com/tailnet-fqdn: archlinux.taildff07.ts.net
spec:
  type: ExternalName
  externalName: unused
  ports:
    - name: http
      port: 32400
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex-ingress
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`plex.local.tylermarques.com`)
      services:
        - name: plex-egress
          port: 32400
  tls:
    secretName: star-local-tylermarques-prod-tls
