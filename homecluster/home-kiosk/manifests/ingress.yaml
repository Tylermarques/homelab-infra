# floorplan.local.tylermarques.com -> home-kiosk. The *.local wildcard in
# Pi-hole already points at Traefik, so no DNS record is needed.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-kiosk-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-kiosk-http
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`floorplan.local.tylermarques.com`)
      middlewares:
        - name: home-kiosk-https-redirect
      services:
        - name: home-kiosk
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-kiosk
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`floorplan.local.tylermarques.com`)
      services:
        - name: home-kiosk
          port: 8080
  tls:
    secretName: star-local-tylermarques-prod-tls
