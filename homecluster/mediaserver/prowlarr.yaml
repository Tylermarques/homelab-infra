# Prowlarr: rendered from the k8s-mediaserver Helm release (chart 0.7.0) that
# originally created these objects, so ArgoCD adopts them without a diff.
# See README.md for the Homepage annotations and the widget API key Secret.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-prowlarr-cm
  namespace: default
data:
  config.xml: |
    <Config>
      <UrlBase>/prowlarr</UrlBase>
    </Config>
  init-prowlarr.sh: |
    #!/bin/bash
    echo "### Initializing config ###"
    if [ ! -f /prowlarr-config/config.xml ]; then
      cp -n /init-prowlarr/config.xml /prowlarr-config/config.xml
      echo "### No configuration found, intialized with default settings ###"
    fi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prowlarr-config
  namespace: default
data:
  PGID: '1000'
  PUID: '1000'
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/instance: k8s-mediaserver
spec:
  type: ClusterIP
  ports:
  - port: 9696
    targetPort: 9696
    protocol: TCP
    name: prowlarr-port
  selector:
    app: prowlarr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/instance: k8s-mediaserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-mediaserver
      app.kubernetes.io/instance: k8s-mediaserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-mediaserver
        app.kubernetes.io/instance: k8s-mediaserver
        app: prowlarr
    spec:
      initContainers:
      - name: config-prowlarr
        image: docker.io/ubuntu:groovy
        command:
        - /init-prowlarr/init-prowlarr.sh
        volumeMounts:
        - mountPath: /init-prowlarr
          name: init-files-prowlarr
        - name: mediaserver-volume
          mountPath: /prowlarr-config
          subPath: config/prowlarr
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      containers:
      - name: k8s-mediaserver
        envFrom:
        - configMapRef:
            name: prowlarr-config
        image: docker.io/linuxserver/prowlarr:develop
        imagePullPolicy: Always
        readinessProbe:
          tcpSocket:
            port: 9696
          initialDelaySeconds: 10
          periodSeconds: 20
        ports:
        - name: prowlarr-port
          containerPort: 9696
          protocol: TCP
        volumeMounts:
        - name: mediaserver-volume
          mountPath: /config
          subPath: config/prowlarr
      volumes:
      - name: mediaserver-volume
        nfs:
          path: /main/plex
          server: 192.168.0.71
      - name: init-files-prowlarr
        configMap:
          defaultMode: 493
          name: init-prowlarr-cm
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/instance: k8s-mediaserver
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Prowlarr
    gethomepage.dev/group: Media
    gethomepage.dev/icon: prowlarr.png
    gethomepage.dev/href: https://media.local.tylermarques.com/prowlarr
    gethomepage.dev/pod-selector: app=prowlarr
    gethomepage.dev/widget.type: prowlarr
    gethomepage.dev/widget.url: http://prowlarr.default.svc.cluster.local:9696/prowlarr
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_PROWLARR_KEY}}'
    # HTTPS only; http://media.local... is redirected by http-redirect.yaml.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Authelia ForwardAuth. Who may pass is decided by the access_control rules
    # for media.local.tylermarques.com in the Authelia Application (admins only,
    # API paths bypassed). The app itself runs with External authentication.
    traefik.ingress.kubernetes.io/router.middlewares: authelia-authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - secretName: star-local-tylermarques-prod-tls
    hosts:
    - media.local.tylermarques.com
  rules:
  - host: media.local.tylermarques.com
    http:
      paths:
      - path: /prowlarr
        pathType: Prefix
        backend:
          service:
            name: prowlarr
            port:
              number: 9696
