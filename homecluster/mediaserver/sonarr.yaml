# Sonarr: rendered from the k8s-mediaserver Helm release (chart 0.7.0) that
# originally created these objects, so ArgoCD adopts them without a diff.
# See README.md for the Homepage annotations and the widget API key Secret.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-sonarr-cm
  namespace: default
data:
  config.xml: |
    <Config>
      <UrlBase>/sonarr</UrlBase>
    </Config>
  init-sonarr.sh: |
    #!/bin/bash
    echo "### Initializing config ###"
    if [ ! -f /sonarr-config/config.xml ]; then
      cp -n /init-sonarr/config.xml /sonarr-config/config.xml
      echo "### No configuration found, intialized with default settings ###"
    fi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarr-config
  namespace: default
data:
  PGID: '1000'
  PUID: '1000'
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/instance: k8s-mediaserver
spec:
  type: ClusterIP
  ports:
  - port: 8989
    targetPort: 8989
    protocol: TCP
    name: sonarr-port
  selector:
    app: sonarr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/instance: k8s-mediaserver
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-mediaserver
      app.kubernetes.io/instance: k8s-mediaserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-mediaserver
        app.kubernetes.io/instance: k8s-mediaserver
        app: sonarr
    spec:
      initContainers:
      - name: config-sonarr
        image: docker.io/ubuntu:groovy
        command:
        - /init-sonarr/init-sonarr.sh
        volumeMounts:
        - mountPath: /init-sonarr
          name: init-files-sonarr
        - name: mediaserver-volume
          mountPath: /sonarr-config
          subPath: config/sonarr
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      containers:
      - name: k8s-mediaserver
        envFrom:
        - configMapRef:
            name: sonarr-config
        image: docker.io/linuxserver/sonarr:latest
        imagePullPolicy: Always
        readinessProbe:
          tcpSocket:
            port: 8989
          initialDelaySeconds: 10
          periodSeconds: 20
        ports:
        - name: sonarr-port
          containerPort: 8989
          protocol: TCP
        volumeMounts:
        - name: mediaserver-volume
          mountPath: /config
          subPath: config/sonarr
        - name: mediaserver-volume
          mountPath: /downloads
          subPath: library/downloads
        - name: mediaserver-volume
          mountPath: /tv
          subPath: library/tv
      volumes:
      - name: mediaserver-volume
        nfs:
          path: /main/plex
          server: 192.168.0.71
      - name: init-files-sonarr
        configMap:
          defaultMode: 493
          name: init-sonarr-cm
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/instance: k8s-mediaserver
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Sonarr
    gethomepage.dev/group: Media
    gethomepage.dev/icon: sonarr.png
    gethomepage.dev/href: https://media.local.tylermarques.com/sonarr
    gethomepage.dev/pod-selector: app=sonarr
    gethomepage.dev/widget.type: sonarr
    gethomepage.dev/widget.url: http://sonarr.default.svc.cluster.local:8989/sonarr
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_SONARR_KEY}}'
    # HTTPS only; http://media.local... is redirected by http-redirect.yaml.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Authelia ForwardAuth. Who may pass is decided by the access_control rules
    # for media.local.tylermarques.com in the Authelia Application (admins only,
    # API paths bypassed). The app itself runs with External authentication.
    traefik.ingress.kubernetes.io/router.middlewares: authelia-authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - secretName: star-local-tylermarques-prod-tls
    hosts:
    - media.local.tylermarques.com
  rules:
  - host: media.local.tylermarques.com
    http:
      paths:
      - path: /sonarr
        pathType: Prefix
        backend:
          service:
            name: sonarr
            port:
              number: 8989
