# Lidarr: rendered from the k8s-mediaserver Helm release (chart 0.7.0) that
# originally created these objects, so ArgoCD adopts them without a diff.
# See README.md for the Homepage annotations and the widget API key Secret.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-lidarr-cm
  namespace: default
data:
  config.xml: |
    <Config>
      <UrlBase>/lidarr</UrlBase>
    </Config>
  init-lidarr.sh: |
    #!/bin/bash
    echo "### Initializing config ###"
    if [ ! -f /lidarr-config/config.xml ]; then
      cp -n /init-lidarr/config.xml /lidarr-config/config.xml
      echo "### No configuration found, intialized with default settings ###"
    fi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lidarr-config
  namespace: default
data:
  PGID: '1000'
  PUID: '1000'
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/instance: k8s-mediaserver
spec:
  type: ClusterIP
  ports:
  - port: 8686
    targetPort: 8686
    protocol: TCP
    name: lidarr-port
  selector:
    app: lidarr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/instance: k8s-mediaserver
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-mediaserver
      app.kubernetes.io/instance: k8s-mediaserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-mediaserver
        app.kubernetes.io/instance: k8s-mediaserver
        app: lidarr
    spec:
      initContainers:
      - name: config-lidarr
        image: docker.io/ubuntu:groovy
        command:
        - /init-lidarr/init-lidarr.sh
        volumeMounts:
        - mountPath: /init-lidarr
          name: init-files-lidarr
        - name: mediaserver-volume
          mountPath: /lidarr-config
          subPath: config/lidarr
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      containers:
      - name: k8s-mediaserver
        envFrom:
        - configMapRef:
            name: lidarr-config
        image: docker.io/linuxserver/lidarr:latest
        imagePullPolicy: Always
        readinessProbe:
          tcpSocket:
            port: 8686
          initialDelaySeconds: 10
          periodSeconds: 20
        ports:
        - name: lidarr-port
          containerPort: 8686
          protocol: TCP
        volumeMounts:
        - name: mediaserver-volume
          mountPath: /config
          subPath: config/lidarr
        - name: mediaserver-volume
          mountPath: /downloads
          subPath: library/downloads
        - name: mediaserver-volume
          mountPath: /music
          subPath: library/music
      volumes:
      - name: mediaserver-volume
        nfs:
          path: /main/plex
          server: 192.168.0.71
      - name: init-files-lidarr
        configMap:
          defaultMode: 493
          name: init-lidarr-cm
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-mediaserver
    app.kubernetes.io/instance: k8s-mediaserver
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Lidarr
    gethomepage.dev/group: Media
    gethomepage.dev/icon: lidarr.png
    gethomepage.dev/href: https://media.local.tylermarques.com/lidarr
    gethomepage.dev/pod-selector: app=lidarr
    gethomepage.dev/widget.type: lidarr
    gethomepage.dev/widget.url: http://lidarr.default.svc.cluster.local:8686/lidarr
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_LIDARR_KEY}}'
spec:
  ingressClassName: traefik
  rules:
  - host: media.local.tylermarques.com
    http:
      paths:
      - path: /lidarr
        pathType: Prefix
        backend:
          service:
            name: lidarr
            port:
              number: 8686
