apiVersion: v1
kind: Namespace
metadata:
  name: dashy  
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dashy
  namespace: dashy
spec:
  selector:
    matchLabels:
      app: dashy
  serviceName: dashy
  replicas: 1
  template:
    metadata:
      labels:
        app: dashy
    spec:
      containers:
      - name: dashy
        image: lissy93/dashy
        env:
          - name: BASE_URL
            value: dashy.tylermarques.com
        ports:
        # Dashy serves on 8080, not 80. This was declared as 80, and because the
        # Service uses targetPort: http it resolved to a port nothing listened on,
        # so dashy.tylermarques.com returned a bare 502 from Traefik. Verified
        # from inside the cluster: pod:8080 -> 200, pod:80 -> connection refused.
        #
        # The image tag is unpinned, so a re-pull picked up a dashy release that
        # moved the default port and broke this silently - the same failure mode
        # as overseerr's sctx/overseerr:latest. Worth pinning.
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /app/public/
          name: dashy-config-dir
        livenessProbe:
          exec:
            command:
              - node 
              - /app/services/healthcheck
          initialDelaySeconds: 40
          periodSeconds: 90
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: dashy-config-dir 
        nfs:
          path: /main/plex/config/dashy/
          server: 192.168.0.71
---
apiVersion: v1
kind: Service
metadata:
  name: dashy
  namespace: dashy
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: dashy
