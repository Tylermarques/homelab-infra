apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich-share
resources:
  - rbac.yaml
  - immich-public-proxy.yaml
  - share-manager.yaml
  - ingress.yaml
  - funnel-ingress.yaml
configMapGenerator:
  - name: immich-share-app
    files:
      - app/server.py
  - name: immich-public-proxy-config
    files:
      - config.json=ipp-config.json
