# The share manager may switch Funnel on its one Ingress and keep its share
# list in one ConfigMap, and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-share
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: immich-share
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["share-funnel"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["immich-share-state"]
    verbs: ["get", "update"]
  # create cannot be limited by resourceNames; it is only used once, to make
  # immich-share-state.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: immich-share
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: immich-share
subjects:
  - kind: ServiceAccount
    name: immich-share
