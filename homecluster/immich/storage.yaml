apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: immich-nfs-retain
provisioner: cluster.local/nfs-subdir-external-provisioner
parameters:
  archiveOnDelete: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: immich-db-local-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 250Gi
  storageClassName: immich-nfs-retain
---
# Drop folder for photos from the laptop or camera. Immich reads it as an
# External Library; it never writes here.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-uploads
spec:
  capacity:
    storage: 250Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: immich
    name: immich-uploads
  nfs:
    server: 192.168.0.71
    path: /main/plex/immich-uploads
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-uploads
  namespace: immich
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 250Gi
  storageClassName: ""
  volumeName: immich-uploads
