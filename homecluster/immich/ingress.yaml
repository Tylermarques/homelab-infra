apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Immich
    gethomepage.dev/group: Media
    gethomepage.dev/icon: immich.png
    gethomepage.dev/href: https://immich.tylermarques.com
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=immich,app.kubernetes.io/name=server
  # Explicit: the Certificate below already pins namespace: immich, but this
  # route did not. Applied without an explicit `-n immich` it would silently
  # land in `default` and never match, so pin it here.
  namespace: immich
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`immich.tylermarques.com`)
      priority: 10
      services:
        - name: immich-server
          port: 2283
  tls:
    secretName: immich-tylermarques-prod-tls

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-tylermarques-com
  namespace: immich
spec:
  secretName: immich-tylermarques-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "immich.tylermarques.com"
  dnsNames:
    - "immich.tylermarques.com"
