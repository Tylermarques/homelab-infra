# Cluster-wide TLS hardening for Traefik.
#
# A TLSOption named `default` is special: Traefik applies it to every router
# that does not name its own TLSOption. So this single object sets the TLS floor
# for every HTTPS service on the cluster.
#
# This was previously ONLY present as a traefik.containo.us object, with no
# manifest anywhere in this repository. Traefik v3 removes the containo.us API
# group, so upgrading would have deleted this object and silently reverted every
# route to Traefik's defaults — TLS 1.2 permitted, sniStrict off, wider cipher
# list. A security regression with no visible symptom. Captured here so it is
# version-controlled and survives the upgrade.
#
# Kept in the `default` namespace to match the original object exactly; moving it
# would change which object Traefik resolves as the global default.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: default
spec:
  minVersion: VersionTLS13
  # Reject connections that do not send SNI, rather than falling back to a
  # default certificate.
  sniStrict: true
  # Note: with minVersion TLS1.3 these cipherSuites entries are TLS1.2 names and
  # are not used for TLS1.3 negotiation (Go does not allow configuring TLS1.3
  # cipher suites). They are preserved verbatim from the original object so this
  # migration changes nothing; they would only take effect if minVersion were
  # ever lowered.
  cipherSuites:
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
