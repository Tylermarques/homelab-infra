apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homecluster-apps
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/Tylermarques/homelab-infra.git
    targetRevision: main
    path: homecluster/app-of-apps/applications
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
