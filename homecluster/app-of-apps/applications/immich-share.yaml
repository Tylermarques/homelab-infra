apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-share
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: immich-share
  source:
    repoURL: https://github.com/Tylermarques/homelab-infra.git
    targetRevision: main
    path: homecluster/immich-share/manifests
  # The share manager switches Funnel on share-funnel by adding and removing
  # this annotation. Argo CD must neither report nor undo that.
  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      name: share-funnel
      jsonPointers:
        - /metadata/annotations/tailscale.com~1funnel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
