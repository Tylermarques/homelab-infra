apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Argo CD
    gethomepage.dev/group: Tools
    gethomepage.dev/icon: argo-cd.png
    gethomepage.dev/href: https://argocd.local.tylermarques.com
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.local.tylermarques.com`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    # The CLI speaks gRPC, which argocd-server only accepts as cleartext HTTP/2.
    - kind: Rule
      match: Host(`argocd.local.tylermarques.com`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls:
    secretName: argocd-local-tls
