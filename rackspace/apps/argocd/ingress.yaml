apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.local.tylermarques.com`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      # Traefik v3 renamed the Headers() matcher to Header(). Both clusters now
      # run Traefik v3 (homecluster 3.3.2, rackspace 3.3.4), so v3 syntax is
      # correct for both. This was the only v2-only rule in the repository.
      match: Host(`argocd.local.tylermarques.com`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          scheme: h2c
          port: 80
  tls:
    secretName: argocd-local-tylermarques-com
